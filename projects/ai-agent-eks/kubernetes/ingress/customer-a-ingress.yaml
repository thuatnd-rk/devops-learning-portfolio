apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: customer-a-host-ingress
  namespace: customer-a
  annotations:
    # QUAN TRỌNG: Cùng group name để dùng chung ALB
    alb.ingress.kubernetes.io/group.name: shared-alb
    
    # Backend protocol (tùy theo ứng dụng của customer)
    alb.ingress.kubernetes.io/backend-protocol: HTTP  # hoặc HTTPS nếu app dùng SSL
    
    # Health check path (tùy theo ứng dụng)
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
    
    # Success codes
    alb.ingress.kubernetes.io/success-codes: '200,301,302'
    
    # Group order
    alb.ingress.kubernetes.io/group.order: '2'
spec:
  ingressClassName: alb
  rules:
    - host: customer-a.rookie.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customer-a-service  # Service trong namespace customer-a
                port:
                  number: 80
