apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-host-ingress
  namespace: argocd
  annotations:
    alb.ingress.kubernetes.io/group.name: shared-alb
    
    # Load balancer configuration
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    
    # SSL/TLS Configuration
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-southeast-1:682743352767:certificate/b77db312-3a1f-447d-b099-7297286837bb
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS-1-2-2017-01
    
    # Listen ports
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    
    # Redirect HTTP to HTTPS
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    
    # Backend protocol (ArgoCD server uses HTTPS)
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    # THỬ: Bỏ HTTP2 nếu có vấn đề
    # alb.ingress.kubernetes.io/backend-protocol-version: HTTP2
    
    # Health check
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
    
    # Success codes
    alb.ingress.kubernetes.io/success-codes: '200'
    
    # THÊM: Matcher cho health check (chỉ accept 200)
    alb.ingress.kubernetes.io/healthcheck-matcher: '200'
    
    # Connection idle timeout
    alb.ingress.kubernetes.io/connection-idle-timeout: '60'
    
    # Group order (số nhỏ hơn = ưu tiên cao hơn khi merge)
    alb.ingress.kubernetes.io/group.order: '1'
spec:
  ingressClassName: alb
  rules:
    - host: argocd.rookie.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80