# projects/ai-agent-eks/argocd/applications/customer-a/frontend-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: customer-b-frontend
  namespace: argocd
  labels:
    customer: customer-b
    service: frontend
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ai-agent
  source:
    repoURL: https://github.com/rookie-ai-agent/frontend
    targetRevision: customer-b
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: customer-b
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true