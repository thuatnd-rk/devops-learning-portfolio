# projects/ai-agent-eks/argocd/applications/customer-a/redis-app-dev.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: customer-a-redis-dev
  namespace: argocd
  labels:
    customer: customer-a
    service: redis
    environment: dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ai-agent
  source:
    repoURL: https://github.com/thuatnd-rk/devops-learning-portfolio
    targetRevision: main
    path: projects/ai-agent-eks/kubernetes/database/redis/overlays/customer-a-dev
  destination:
    server: https://kubernetes.default.svc
    namespace: customer-a-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

