apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: customer-a-frontend-dev
  namespace: argocd
  labels:
    customer: customer-a
    service: frontend
    environment: dev
spec:
  project: ai-agent
  source:
    repoURL: https://github.com/rookie-ai-agent/frontend
    targetRevision: customer-a
    path: kubernetes/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: customer-a-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true