# projects/ai-agent-eks/argocd/applications/customer-a/data-manager-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: customer-a-data-manager
  namespace: argocd
  labels:
    customer: customer-a
    service: data-manager
  finalizers:
    - resources-finalizer.argoproj.io
spec:
  project: ai-agent
  source:
    repoURL: https://github.com/rookie-ai-agent/data-manager
    targetRevision: customer-a
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: customer-a
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true