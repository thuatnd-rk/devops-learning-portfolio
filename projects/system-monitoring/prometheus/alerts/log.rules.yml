groups:
  - name: log_alerts
    rules:
      - alert: HighErrorRate
        expr: sum(rate({job="fluent-bit", level="error"}[5m])) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second"

      - alert: LogVolumeSpike
        expr: sum(rate({job="fluent-bit"}[5m])) > 1000
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Log volume spike detected"
          description: "Log volume is {{ $value }} logs per second"

      - alert: ContainerLogFailure
        expr: sum(rate({job="fluent-bit", container_name=~".*"}[5m])) by (container_name) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Container log collection failed"
          description: "No logs received from container {{ $labels.container_name }}"

      - alert: HighWarningRate
        expr: sum(rate({job="fluent-bit", level="warning"}[5m])) > 50
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High warning rate detected"
          description: "Warning rate is {{ $value }} warnings per second" 