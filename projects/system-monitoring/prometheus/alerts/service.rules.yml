groups:
  - name: service_health_alerts
    rules:
      - alert: ServiceHealthCheckFailed
        expr: probe_success{job="service-health"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service health check failed"
          description: "Service {{ $labels.instance }} is not responding to health checks"

      - alert: ServiceHealthCheckSlow
        expr: probe_duration_seconds{job="service-health"} > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Service health check is slow"
          description: "Service {{ $labels.instance }} is responding slowly ({{ $value }}s)"

      - alert: ServiceHealthCheckSSL
        expr: probe_ssl_earliest_cert_expiry{job="service-health"} - time() < 86400 * 30
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "SSL certificate expiring soon"
          description: "SSL certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}" 