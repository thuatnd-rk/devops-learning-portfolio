apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-local-pv
  namespace: chatbot
  labels:
    app: postgres
    component: database
    storage-type: local
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /mnt/data/postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - ip-10-0-8-129  # Thay đổi thành tên node của bạn
