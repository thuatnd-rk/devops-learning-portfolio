apiVersion: v1
kind: Service
metadata:
  name: cagent-backend
  namespace: chatbot
  labels:
    app: cagent-backend
    component: backend
    environment: production
    team: devops
spec:
  type: ClusterIP
  selector:
    app: cagent-backend
    component: backend
  ports:
    - name: http
      port: 3000
      targetPort: 3000


