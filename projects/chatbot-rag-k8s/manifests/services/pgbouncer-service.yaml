apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: chatbot
  labels:
    app: pgbouncer
    component: database
    environment: production
    team: devops
spec:
  type: ClusterIP
  ports:
    - port: 6432
      targetPort: 6432
      protocol: TCP
      name: pgbouncer
  selector:
    app: pgbouncer
    component: database


