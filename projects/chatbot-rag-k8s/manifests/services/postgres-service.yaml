apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: chatbot
  labels:
    app: postgres
    component: database
    environment: production
    team: devops
spec:
  type: ClusterIP  # Chỉ internal access
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: postgres
    component: database
