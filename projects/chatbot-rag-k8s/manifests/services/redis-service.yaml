apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: chatbot
  labels:
    app: redis
    component: cache
    service: redis
    environment: production
    team: devops
  annotations:
    description: "Redis service for session management and caching"
spec:
  type: ClusterIP  # Chỉ expose nội bộ cluster
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app: redis
    component: cache
  sessionAffinity: None
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
