apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: chatbot
  labels:
    app: pgbouncer
    component: database
    environment: production
    team: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer
      component: database
  template:
    metadata:
      labels:
        app: pgbouncer
        component: database
        environment: production
        team: devops
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6432
          env:
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: AUTH_TYPE
              value: "scram-sha-256"
            - name: POOL_MODE
              value: "transaction"
            - name: MAX_CLIENT_CONN
              value: "500"
            - name: DEFAULT_POOL_SIZE
              value: "50"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: pgbouncer-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgbouncer-secret
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: pgbouncer-secret
                  key: DB_NAME
            - name: AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: pgbouncer-secret
                  key: DB_USER
          volumeMounts:
            - name: pgbouncer-config
              mountPath: /etc/pgbouncer
          command: ["/bin/sh","-ec"]
          args:
            - |
              mkdir -p /etc/pgbouncer
              cat > /etc/pgbouncer/pgbouncer.ini <<EOF
              [databases]
              ${DB_NAME} = host=${DB_HOST} port=${DB_PORT} dbname=${DB_NAME} user=${DB_USER} password='${DB_PASSWORD}'

              [pgbouncer]
              listen_addr = 0.0.0.0
              listen_port = 6432
              auth_type = ${AUTH_TYPE}
              pool_mode = ${POOL_MODE}
              max_client_conn = ${MAX_CLIENT_CONN}
              default_pool_size = ${DEFAULT_POOL_SIZE}
              ignore_startup_parameters = extra_float_digits
              auth_user = ${AUTH_USER:-${DB_USER}}
              auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=\$1
              auth_file = /etc/pgbouncer/userlist.txt
              EOF

              # Cấp mật khẩu cho auth_user (dùng plain từ Secret)
              printf '"%s" "%s"\n' "${AUTH_USER:-${DB_USER}}" "${DB_PASSWORD}" > /etc/pgbouncer/userlist.txt

              exec pgbouncer /etc/pgbouncer/pgbouncer.ini
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: pgbouncer-config
          emptyDir: {}


