apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-explorer-api
  namespace: chatbot
  labels:
    app: s3-explorer-api
    component: api
    environment: production
    team: devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3-explorer-api
      component: api
  template:
    metadata:
      labels:
        app: s3-explorer-api
        component: api
        environment: production
        team: devops
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: s3-explorer-api
          image: 187091248012.dkr.ecr.us-east-1.amazonaws.com/pvi/s3:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            # S3 / AWS
            - name: S3_STORAGE_BUCKET_NAME
              value: "ndthuat-lab"
            - name: S3_STORAGE_REGION
              value: "ap-southeast-1"
            - name: AWS_REGION
              value: "ap-southeast-1"

            # Redis from service + AWS Secrets Manager
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: redis_password

            # Database (Postgres) from service + AWS Secrets Manager
            - name: DATABASE_TYPE
              value: "postgres"
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_HOST
              value: "postgres"
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres_database
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres_username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres_password

            # Other app configs (kept as provided)
            - name: BASE_URL
              value: "http://3.231.34.3:8001"
            - name: X_AUTH_SECRET_KEY
              value: "tX5YKLeoCEBDYehSUjSDrFAqqbPIwpO3h52A1ZI7hBPjJWrX4zkMEZLAQDOD"
            - name: BASE_URL_AI_SERVICE
              value: "http://3.231.34.3:8001"
            - name: PORT
              value: "3001"
            - name: TRIGGER_SECRET_KEY
              value: "tr_prod_mMP6G7TwztxLG7X0Wk56"
            - name: TRIGGER_PROJECT_ID
              value: "proj_poduzmcipqbvfglroxzm"
            - name: TRIGGER_API_URL
              value: "https://trigger.1882.studio.ai.vn"
            - name: FILE_HOST
              value: ""
            - name: MEILISEARCH_HOST
              value: "https://search.cmcts1.studio.ai.vn"
            - name: MEILISEARCH_API_KEY
              value: "6503e9ce62dfbdd119ebc9819821a85948eeffcfe3b502c35ab1765c225b9aae"
            - name: CRAWL_BASE_URL
              value: "https://firecrawl.1882.studio.ai.vn"
            - name: DRIVE_REDIRECT_URI
              value: "https://stock.cmcts.ai/c-agent/document-stores-new"

          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"


