apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: chatbot
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1  # Thay đổi region phù hợp với bạn
      # Sử dụng Pod Identity authentication (không cần khai báo auth section)
      # EC2 instance sẽ sử dụng IAM role được gắn
