apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress-ingress
  namespace: wordpress
  annotations:
    # AWS Load Balancer Controller annotations
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    
    # SSL/TLS với cert-manager
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    
    # Nếu dùng ACM certificate (AWS Certificate Manager)
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-southeast-1:682743352767:certificate/b77db312-3a1f-447d-b099-7297286837bb
    
    # Health check
    alb.ingress.kubernetes.io/healthcheck-path: /wp-login.php
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    alb.ingress.kubernetes.io/success-codes: "200,302"
    
    # Group name (để share ALB giữa nhiều Ingress nếu cần)
    alb.ingress.kubernetes.io/group.name: shared-alb
    
    # External DNS annotation (tự động tạo Route53 record)
    external-dns.alpha.kubernetes.io/hostname: wordpress.rookie.click
spec:
  ingressClassName: alb
  rules:
    - host: wordpress.rookie.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress-service
                port:
                  number: 80